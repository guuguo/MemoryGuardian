name: Windows preview
on:
  workflow_dispatch:
  push:
    paths: ['windows/**', 'scripts/*windows*', '.github/workflows/windows-preview.yml']
  pull_request:
    paths: ['windows/**', 'scripts/*windows*', '.github/workflows/windows-preview.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Native sampling self-test
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemoryGuardian-win-x64-preview
          path: |
            dist/MemoryGuardian-win-x64-preview.zip
            dist/windows-self-test.json
